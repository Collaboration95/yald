name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build web app
        run: bun run build

      # No opencodex ledger exists on a runner, so the smoke test falls back to the
      # synthetic fixture home and still exercises every page with data.
      - name: Server-render smoke test
        run: bun run smoke
