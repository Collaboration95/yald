name: ci

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.produce.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Only this job builds/packs the installed candidate. Never overwrite an
      # earlier attempt. Failed-job reruns retain this producer's output name.
      - name: Produce the candidate once
        id: produce
        run: node scripts/qualify-package.mjs produce "$RUNNER_TEMP/yald-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.produce.outputs.artifact-name }}
          path: ${{ runner.temp }}/yald-candidate/
          if-no-files-found: error
          retention-days: 90

  verify:
    needs: candidate
    # A failed producer must fail the required checks, never skip them green.
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require the successful candidate producer
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          CANDIDATE_ARTIFACT: ${{ needs.candidate.outputs.artifact-name }}
        run: test "$CANDIDATE_RESULT" = success && test -n "$CANDIDATE_ARTIFACT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit and API tests
        run: bun test

      # Time windows must not depend on the zone the server process runs in.
      - name: Time-window tests under several process time zones
        run: |
          for zone in UTC Asia/Singapore America/Los_Angeles; do
            TZ="$zone" bun test server/src/time
          done

      - name: Build web app
        run: bun run build

      # Always synthetic, including all existing investigation/evidence and
      # report harnesses. The source build above never replaces the candidate.
      - name: Server-render smoke test
        run: bun run smoke -- --fixtures

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: ${{ runner.temp }}/yald-candidate

      - name: Verify the unchanged installed candidate
        env:
          YALD_CANDIDATE_ARTIFACT: ${{ needs.candidate.outputs.artifact-name }}
        run: node scripts/qualify-package.mjs verify "$RUNNER_TEMP/yald-candidate" "$RUNNER_TEMP/yald-receipt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yald-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: ${{ runner.temp }}/yald-receipt/
          if-no-files-found: error
          retention-days: 90
