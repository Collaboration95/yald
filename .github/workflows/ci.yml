name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit and API tests
        run: bun test

      - name: Build web app
        run: bun run build

      # No opencodex ledger exists on a runner, so the smoke test falls back to the
      # synthetic fixture home and still exercises every page with data.
      - name: Server-render smoke test
        run: bun run smoke

      - name: Install the distribution package
        run: |
          release_version="$(node -p 'require("./package.json").version')"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/yald-install" --no-audit --no-fund \
            "$RUNNER_TEMP/yald-dashboard-${release_version}.tgz"
          installed_version="$(node "$RUNNER_TEMP/yald-install/node_modules/.bin/yald" --version)"
          test "$installed_version" = "$release_version"
          node "$RUNNER_TEMP/yald-install/node_modules/.bin/yald" --help
